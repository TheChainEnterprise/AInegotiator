<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #f8fafc;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    button, input {
      font: inherit;
    }
    #app {
      width: 100%;
      height: 100%;
      padding: 6px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }
    #open {
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: #22d3ee;
      color: #042f36;
      box-shadow: 0 10px 28px rgba(34, 211, 238, .5);
      font-weight: 700;
    }
    #panel {
      display: none;
      width: 374px;
      height: 590px;
      overflow: hidden;
      border: 1px solid rgba(34, 211, 238, .3);
      border-radius: 20px;
      background: #0b1118;
      box-shadow: none; /* Shadow completely removed here */
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px;
      border-bottom: 1px solid rgba(34, 211, 238, .15);
    }
    h1 {
      margin: 0;
      font-size: 18px;
    }
    header p {
      margin: 4px 0 0;
      color: #67e8f9;
      font-size: 13px;
    }
    #close {
      border: 0;
      background: transparent;
      color: #bae6fd;
      font-size: 23px;
      cursor: pointer;
    }
    #messages {
      height: 455px;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      max-width: 88%;
      margin-bottom: 12px;
      padding: 11px 13px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.4;
    }
    .assistant {
      background: #22d3ee;
      color: #042f36;
    }
    .user {
      margin-left: auto;
      background: #26323d;
      color: #ffffff !important;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 13px;
      border-top: 1px solid rgba(34, 211, 238, .15);
    }
    input {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(34, 211, 238, .3);
      border-radius: 10px;
      background: #05070a;
      color: #ffffff !important;
      outline: none;
      padding: 11px;
    }
    input:focus {
      border-color: #22d3ee;
    }
    input::placeholder {
      color: #94a3b8;
    }
    #send {
      border: 0;
      border-radius: 10px;
      padding: 0 13px;
      background: #22d3ee;
      color: #042f36;
      cursor: pointer;
      font-weight: 700;
    }
    #send:disabled {
      cursor: wait;
      opacity: .6;
    }
  </style>
</head>
<body>
  <main id="app" style="all: initial; display: flex; width: 100%; height: 100%; align-items: flex-end; justify-content: flex-end; font-family: Arial, sans-serif;">
    <button id="open" type="button" aria-label="Open chat">Chat</button>
    <section id="panel" aria-label="AI receptionist chat">
      <header>
        <div>
          <h1 id="title">AI Receptionist</h1>
          <p>Online now</p>
        </div>
        <button id="close" type="button" aria-label="Close chat">×</button>
      </header>
      <div id="messages" aria-live="polite"></div>
      <form id="form">
        <input id="input" autocomplete="off" maxlength="2000" placeholder="How can we help?" />
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </main>
  
  <script>
    (() => {
      const params = new URLSearchParams(location.search),
            tenant = params.get("tenant") || "",
            label = params.get("label") || "Chat with us",
            valid = /^[a-z0-9_-]{1,80}$/i.test(tenant),
            panel = document.querySelector("#panel"),
            open = document.querySelector("#open"),
            close = document.querySelector("#close"),
            form = document.querySelector("#form"),
            input = document.querySelector("#input"),
            send = document.querySelector("#send"),
            messages = document.querySelector("#messages");

      document.querySelector("#title").textContent = label;

      const key = "the-chain-widget:" + tenant;
      let sessionId = localStorage.getItem(key);
      if (!sessionId) {
        sessionId = "visitor-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(key, sessionId);
      }

      const tell = isOpen => parent.postMessage({ source: "the-chain-deploy-widget", open: isOpen }, "*");

      const setOpen = isOpen => {
        panel.style.display = isOpen ? "block" : "none";
        open.style.display = isOpen ? "none" : "block";
        tell(isOpen);
        if (isOpen) input.focus();
      };

      const add = (role, text) => {
        const item = document.createElement("div");
        item.className = "message " + role;
        item.textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
        return item;
      };

      open.addEventListener("click", () => setOpen(true));
      close.addEventListener("click", () => setOpen(false));

      if (!valid) {
        add("assistant", "This chat is not configured correctly.");
        send.disabled = true;
        return;
      }

      add("assistant", "Hello! How can I help you today?");

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || send.disabled) return;
        
        add("user", message);
        input.value = "";
        send.disabled = true;
        
        const reply = add("assistant", "Thinking…");
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-tenant-id": tenant },
            body: JSON.stringify({ sessionId, message, tenantId: tenant })
          });
          const data = await response.json().catch(() => ({}));
          reply.textContent = response.ok && data.response ? data.response : "Sorry, I could not respond right now. Please try again.";
        } catch {
          reply.textContent = "Sorry, I could not connect right now. Please try again.";
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    })();
  </script>
</body>
</html>
