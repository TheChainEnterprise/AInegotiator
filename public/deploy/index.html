<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #f8fafc;
      --chat-primary: #22d3ee;   /* message bubble / button background */
      --chat-text: #042f36;      /* text on top of --chat-primary */
      --chat-panel-bg: #0b1118;  /* CHANGED: whole widget box background, now independent of --chat-primary */
      --chat-panel-text: #f8fafc; /* CHANGED: title/borders/New Chat/close/"Online now", contrasts against --chat-panel-bg, not --chat-primary */
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
    }
    button, input {
      font: inherit;
    }
    #app {
      width: 100%;
      height: 100%;
      padding: 6px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }
    #open {
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: var(--chat-primary);
      color: var(--chat-text);
      box-shadow: 0 0px 0px rgba (0, 0, 0, .0);
      font-weight: 700;
    }
    #panel {
      display: none;
      width: 374px;
      height: 590px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--chat-panel-text) 25%, transparent); /* CHANGED: was tied to primary, now to panel-text so it stays visible against panel-bg regardless of primary */
      border-radius: 20px;
      background: var(--chat-panel-bg); /* CHANGED: was hardcoded #0b1118 */
      box-shadow: none;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px;
      border-bottom: 1px solid color-mix(in srgb, var(--chat-panel-text) 15%, transparent); /* CHANGED */
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: var(--chat-panel-text); /* CHANGED: was hardcoded white, now follows panel-text so it works on light panels too */
    }
    header p {
      margin: 4px 0 0;
      color: color-mix(in srgb, var(--chat-panel-text) 75%, var(--chat-primary) 25%); /* CHANGED: was fixed cyan, now a soft tint of panel-text */
      font-size: 13px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #newchat {
      border: 1px solid color-mix(in srgb, var(--chat-panel-text) 40%, transparent); /* CHANGED: was tied to primary */
      background: transparent;
      color: var(--chat-panel-text); /* CHANGED: was tied to primary */
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
    }
    #newchat:hover {
      background: color-mix(in srgb, var(--chat-panel-text) 12%, transparent); /* CHANGED */
    }
    #close {
      border: 0;
      background: transparent;
      color: var(--chat-panel-text); /* CHANGED: was tied to primary */
      font-size: 23px;
      cursor: pointer;
    }
    #messages {
      height: 455px;
      overflow-y: auto;
      padding: 15px;
    }
    .message {
      max-width: 88%;
      margin-bottom: 12px;
      padding: 11px 13px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.4;
    }
    .assistant {
      background: var(--chat-primary);
      color: var(--chat-text);
    }
    .user {
      margin-left: auto;
      background: color-mix(in srgb, var(--chat-panel-text) 18%, var(--chat-panel-bg) 82%); /* CHANGED: was hardcoded #26323d, now derives from panel colors so it fits any theme */
      color: var(--chat-panel-text); /* CHANGED: was hardcoded white */
    }
    form {
      display: flex;
      gap: 8px;
      padding: 13px;
      border-top: 1px solid color-mix(in srgb, var(--chat-panel-text) 15%, transparent); /* CHANGED */
    }
    input {
      flex: 1;
      min-width: 0;
      border: 1px solid color-mix(in srgb, var(--chat-panel-text) 25%, transparent); /* CHANGED */
      border-radius: 10px;
      background: color-mix(in srgb, var(--chat-panel-bg) 85%, black 15%); /* CHANGED: was hardcoded #05070a, now a shade of panel-bg */
      color: var(--chat-panel-text); /* CHANGED: was hardcoded white */
      outline: none;
      padding: 11px;
    }
    input:focus {
      border-color: var(--chat-primary);
    }
    input::placeholder {
      color: color-mix(in srgb, var(--chat-panel-text) 55%, transparent); /* CHANGED: was hardcoded #94a3b8 */
    }
    #send {
      border: 0;
      border-radius: 10px;
      padding: 0 13px;
      background: var(--chat-primary);
      color: var(--chat-text);
      cursor: pointer;
      font-weight: 700;
    }
    #send:disabled {
      cursor: wait;
      opacity: .6;
    }
  </style>
</head>
<body>
  <main id="app" style="all: initial; display: flex; width: 100%; height: 100%; align-items: flex-end; justify-content: flex-end; font-family: Arial, sans-serif;">
    <button id="open" type="button" aria-label="Open chat">Chat</button>
    <section id="panel" aria-label="AI receptionist chat">
      <header>
        <div>
          <h1 id="title">AI Receptionist</h1>
          <p>Online now</p>
        </div>
        <div class="header-actions">
          <button id="newchat" type="button">New Chat</button>
          <button id="close" type="button" aria-label="Close chat">×</button>
        </div>
      </header>
      <div id="messages" aria-live="polite"></div>
      <form id="form">
        <input id="input" autocomplete="off" maxlength="2000" placeholder="How can we help?" />
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(location.search),
            tenant = params.get("tenant") || "",
            label = params.get("label") || "Chat with us",
            customPrimary = params.get("primary"),
            customText = params.get("text"),
            customPanelBg = params.get("panelBg"),
            customPanelText = params.get("panelText"),
            valid = /^[a-z0-9_-]{1,80}$/i.test(tenant),
            panel = document.querySelector("#panel"),
            open = document.querySelector("#open"),
            close = document.querySelector("#close"),
            newChatBtn = document.querySelector("#newchat"),
            form = document.querySelector("#form"),
            input = document.querySelector("#input"),
            send = document.querySelector("#send"),
            messages = document.querySelector("#messages");

      // Validates that a string is a real #hex color before trusting it.
      const isHex = (value) => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value || "");

      // Given a background hex color, returns black or white — whichever
      // gives better readability — using standard relative luminance.
      const contrastFor = (hex) => {
        let h = hex.replace("#", "");
        if (h.length === 3) h = h.split("").map(c => c + c).join("");
        const r = parseInt(h.substring(0, 2), 16) / 255;
        const g = parseInt(h.substring(2, 4), 16) / 255;
        const b = parseInt(h.substring(4, 6), 16) / 255;
        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        return lum > 0.55 ? "#0f172a" : "#ffffff";
      };

      // ---- Bubble/button color: --chat-primary + --chat-text ----
      if (customPrimary && isHex(customPrimary)) {
        document.documentElement.style.setProperty("--chat-primary", customPrimary);
        document.documentElement.style.setProperty(
          "--chat-text",
          (customText && isHex(customText)) ? customText : contrastFor(customPrimary)
        );
      } else if (customText && isHex(customText)) {
        document.documentElement.style.setProperty("--chat-text", customText);
      }

      // ---- NEW: whole-widget background color: --chat-panel-bg + --chat-panel-text ----
      // This is fully independent from the primary/bubble color above, so setting
      // one never accidentally breaks contrast on the other.
      if (customPanelBg && isHex(customPanelBg)) {
        document.documentElement.style.setProperty("--chat-panel-bg", customPanelBg);
        document.documentElement.style.setProperty(
          "--chat-panel-text",
          (customPanelText && isHex(customPanelText)) ? customPanelText : contrastFor(customPanelBg)
        );
      } else if (customPanelText && isHex(customPanelText)) {
        document.documentElement.style.setProperty("--chat-panel-text", customPanelText);
      }
      // ---- END COLOR BLOCK ----

      document.querySelector("#title").textContent = label;

      // ---- Persistent session id + persistent message history ----
      const sessionKey = "the-chain-widget:" + tenant;
      const historyKey = "the-chain-widget-history:" + tenant;

      let sessionId = localStorage.getItem(sessionKey);
      if (!sessionId) {
        sessionId = "visitor-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(sessionKey, sessionId);
      }

      const loadHistory = () => {
        try {
          return JSON.parse(localStorage.getItem(historyKey) || "[]");
        } catch {
          return [];
        }
      };

      const saveHistory = (history) => {
        localStorage.setItem(historyKey, JSON.stringify(history));
      };

      let history = loadHistory();

      const tell = isOpen => parent.postMessage({ source: "the-chain-deploy-widget", open: isOpen }, "*");

      const setOpen = isOpen => {
        panel.style.display = isOpen ? "block" : "none";
        open.style.display = isOpen ? "none" : "block";
        tell(isOpen);
        if (isOpen) input.focus();
      };

      // `persist: false` is used for transient states like "Thinking…"
      // so we never save a placeholder into history.
      const add = (role, text, persist = true) => {
        const item = document.createElement("div");
        item.className = "message " + role;
        item.textContent = text;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
        if (persist) {
          history.push({ role, text });
          saveHistory(history);
        }
        return item;
      };

      const startNewChat = () => {
        sessionId = "visitor-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(sessionKey, sessionId);
        history = [];
        saveHistory(history);
        messages.innerHTML = "";
        add("assistant", "Hello! How can I help you today?");
      };

      open.addEventListener("click", () => setOpen(true));
      close.addEventListener("click", () => setOpen(false));
      newChatBtn.addEventListener("click", startNewChat);

      if (!valid) {
        add("assistant", "This chat is not configured correctly.", false);
        send.disabled = true;
        return;
      }

      // ---- Restore prior conversation instead of always greeting ----
      if (history.length) {
        history.forEach(entry => {
          const item = document.createElement("div");
          item.className = "message " + entry.role;
          item.textContent = entry.text;
          messages.appendChild(item);
        });
        messages.scrollTop = messages.scrollHeight;
      } else {
        add("assistant", "Hello! How can I help you today?");
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message || send.disabled) return;

        add("user", message);
        input.value = "";
        send.disabled = true;

        const reply = add("assistant", "Thinking…", false);
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-tenant-id": tenant },
            body: JSON.stringify({ sessionId, message, tenantId: tenant })
          });
          const data = await response.json().catch(() => ({}));
          const finalText = response.ok && data.response ? data.response : "Sorry, I could not respond right now. Please try again.";
          reply.textContent = finalText;
          history.push({ role: "assistant", text: finalText });
          saveHistory(history);
        } catch {
          const finalText = "Sorry, I could not connect right now. Please try again.";
          reply.textContent = finalText;
          history.push({ role: "assistant", text: finalText });
          saveHistory(history);
        } finally {
          send.disabled=false;
          input.focus();
        }
      });
    })();
  </script>
</body>
</html>
